<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Livre</title>

    <script>
        const path = window.location.pathname;

        if (path.startsWith('/livre/')) {
          const destino =
            '/livre/?redirect=' +
            encodeURIComponent(
              path.substring('/livre'.length) +
              window.location.search +
              window.location.hash
            );

          window.location.replace(destino);
        } else {
          window.location.replace('/livre/');
        }
    </script>
</head>

<body>
<p>A carregar o Livre...</p>
</body>
</html>
